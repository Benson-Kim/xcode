XCODE Web
v2.28 09 October 2026  Tables run edge to edge across the white sheet, the same width as the headline bar. The
                       side margin is smaller everywhere, and the first and last columns keep that margin so
                       table text lines up with the bar, the title and the toolbar.
v2.27 09 October 2026  The headline bar is now exactly as wide as the white working sheet below it, edge to edge,
                       on every page. Its contents still line up with the table's columns.
v2.26 09 October 2026  Everything above a table now lines up with the table's edges. Petty cash: the headline bar
                       runs the full width, with the action and profile at its right end. Tabs on Scheduled
                       expenses and Expense items span the full width. PDF: the figure tiles span the table.
v2.25 09 October 2026  PDF export redesigned: brand header with the logo, headline card and figure tiles, banded
                       rows, status chips, share bars, totals row, page footers. Central expenses and Revenue:
                       source, search and export moved onto the headline bar, so the table starts higher.
                       Savings carry an opening balance (date and amount per vehicle) for balances brought in
                       from another system, and show a running balance.
v2.24 09 October 2026  Access is back on the tick list design, one card per module with All, and the rights are
                       finer: view, add, edit, approve, reject, pause, block and export are each their own
                       right, 46 in all. An action right switches its module's view right on; switching view
                       off clears the module. The vehicles a person can see stay as in v2.23.
v2.23 09 October 2026  Access is set module by module: None, View, or View and edit, with the control rights of
                       each module beside it. Each person also has the vehicles they can see; every list, total,
                       form and export is cut to those vehicles. View only shows a module with no add, edit or
                       approve actions.
v2.22 09 October 2026  Savings can carry a revenue rule: save only when the vehicle's revenue reaches a target that
                       day, over the 7 days to the run, or over the 30 days to the run. A saving can also run
                       every day. Each run is decided per vehicle once the revenue is captured: saved, skipped,
                       or waiting for revenue. Runs pop up on each saving, and a Savings report.
v2.21 09 October 2026  One transaction, one vehicle, one row. A purchase shared by several vehicles is captured once
                       and saved as one transaction per vehicle; scheduled runs post one row per vehicle. Central
                       expenses shows the source as Central, Petty cash or Scheduled. The date opens a list:
                       Today, Yesterday, This week, Last week, Last 4 weeks, This month, Last month, or custom
                       dates. Petty cash can show any period. Export to Excel and PDF above every table.
v2.20 09 October 2026  Top bar removed. Company, viewing as and sign out sit under the profile button, top right of
                       every page. One date control everywhere, first thing on the headline bar: by day on petty
                       cash, by week on dashboard, revenue, central expenses and reports, with a Week or 4 weeks
                       switch. Petty cash top is one row: date, balance sum, action, profile.
v2.19 09 October 2026  Every form on the web is a pop up: central expense, scheduled expense, saving, person, capture
                       revenue and the Setup edits. Only the revenue grid keeps its row edit. Expenses has three
                       parts: Central expenses (the ledger everything lands in), Petty cash (lands when approved)
                       and Scheduled expenses (post in full on the run date, like a standing order). Petty cash
                       top: no title, the date once with previous and next, then
                       Cash balance = Opening balance + Cash issued - Expenses - Credit notes.
v2.18 09 October 2026  Petty cash: no reason asked when issuing cash; manager balances removed from the top; header
                       buttons follow the view; a manager records spending as themselves; item is a type to
                       search field. Six petty cash reports, inside the module and under Reports.
v2.17 09 October 2026  Shorter brand zone on every page so tables get the height. Petty cash shows one table at a
                       time, toggled between Expenses and Cash received; one search covers every column; managers
                       are a drop down that opens on All managers.
v2.16 09 October 2026  Type rebalanced: smaller steps, calmer weights. Layout unchanged.
v2.15 09 October 2026  Same brand as XCODE Mobile v2.7. One type family, Figtree; Fraunces kept only in the logo.
                       Deep teal to blue brand zone holds the title, actions and headline card; the working sheet
                       rises over it. Page structure and density unchanged.
v2.14 09 October 2026  Float warning removed; spending is never held back by the float level. A default petty cash
                       manager can be set on a person. Approved or rejected entries can be reopened, with a
                       reason, behind its own right.
v2.13 09 October 2026  New pop up design, one shell for every pop up. Petty cash Record spending and Edit now open
                       in it with only vehicle, item, qty and unit cost; date and manager come from the screen.
                       Issue cash, Credit note and Reject use the same shell. Bottom sheet on a phone.
v2.12 09 October 2026  Petty cash has no editing inside the table. Edit opens the full page spending form, and
                       Reject asks for the reason in a small pop up.
v2.11 09 October 2026  Opens straight into the system as the owner, no sign in to pass. A person switcher in the top
                       bar shows each person's view. Review aid only: the sign in screen stays, reached from Sign out.
v2.10 09 October 2026  Teal version. Teal carries commit, approve, selection and money in; neutral actions are ink.
                       Sign in opens with the PIN empty and must be typed. Logo unchanged.
v2.9  09 October 2026  Whole file moved to XCODE Brand v2.0: blue core, teal for approve and save, full width.
                       Petty cash is the locked full width day ledger (Qty, Unit cost, Total amount, Actions).
                       Logo unchanged. Gold now appears only in the logo and on waiting or paused states.
v2.8  earlier          Navy and cream palette. Superseded.

<style>
/* Layout: ink side menu, full width work area, one headline band per screen, tables edge to edge. */
:root{
  --deep:#04202F; --deep-2:#06364A; --deep-3:#0A5560;
  --card-a:#11A397; --card-b:#1273B8;
  --ink:#06283A; --ink-2:#1E3A47; --slate:#547079;
  --paper:#F2F7F8; --paper-2:#E3EDEF; --shell:#FFFFFF;
  --line:#D5E2E5; --line-soft:#E8F0F2;
  --teal:#0F766E; --teal-dark:#0B5A54; --teal-mid:#3DB3A6; --teal-lift:#58CDBF; --teal-bright:#2DD4BF; --teal-wash:#DDF3F0;
  --clay:#B3261E; --clay-dark:#8E1D17; --clay-wash:#FCEEEC; --neg-on-dark:#FFB4AB;
  --gold:#8A6100; --gold-pure:#F0A93A; --gold-wash:#FFF4E0;
  --logo-blue:#6AA6FF; --logo-gold:#F0A93A;
  --white:#FFFFFF;
  --on-ink:rgba(255,255,255,.78); --on-ink-dim:rgba(255,255,255,.52);
  --on-ink-line:rgba(255,255,255,.16); --on-ink-hover:rgba(255,255,255,.09);
  --on-deep:rgba(255,255,255,.74); --glass:rgba(255,255,255,.1); --glass-2:rgba(255,255,255,.17); --glass-line:rgba(255,255,255,.2);
  --scrim:rgba(4,32,47,.56); --shadow:rgba(4,32,47,.24);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-display:var(--f-ui);
  --f-logo:'Fraunces',Georgia,'Times New Roman',serif;
  --gut:clamp(18px,3.2vw,48px); --r-ctl:10px; --r-card:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink-2);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-optical-sizing:auto;color:var(--ink);margin:0;font-weight:600;text-wrap:balance}
h1{font-size:clamp(24px,2.4vw,30px);line-height:1.1;letter-spacing:-.012em}
h2{font-size:19px;line-height:1.2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{height:100%}

/* logo, unchanged */
.logo{display:flex;align-items:center;gap:10px}
.mark{flex:none}
.mark path{fill:none;stroke-width:6.5;stroke-linecap:round}
.mark .a{stroke:var(--logo-blue)} .mark .b{stroke:var(--logo-gold)}
.wm{display:block;font-family:var(--f-logo);font-weight:700;font-size:21px;letter-spacing:.14em;color:var(--white);line-height:1}
.wmsub{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--on-ink-dim);font-weight:700;margin-top:5px}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.nav{background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;gap:2px;overflow:auto;padding:18px 12px 16px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 16px 10px;border-bottom:1px solid var(--on-ink-line);margin-bottom:10px}
.navbtn{background:none;border:0;color:var(--on-ink);padding:7px;border-radius:9px;display:flex}
.navbtn:hover{background:var(--on-ink-hover);color:var(--white)}
.ni{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--on-ink);padding:9px 12px;border-radius:9px;font-weight:600;font-size:14.5px;text-align:left}
.ni svg{flex:none}
.ni .lb{flex:1;min-width:0}
.ni:hover{background:var(--on-ink-hover);color:var(--white)}
.ni.on{background:var(--teal);color:var(--white)}
.ni.sub{padding-left:42px;font-size:14px}
.ni.sub svg{display:none}
.ni .b{background:var(--teal-lift);color:var(--ink);border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 8px;font-variant-numeric:tabular-nums}
.ni .chev{display:flex;transition:transform .15s}
.ni[aria-expanded=false] .chev{transform:rotate(-90deg)}
.kids{display:flex;flex-direction:column;gap:2px}
.ver{margin-top:auto;padding:18px 12px 0;font-size:11.5px;color:var(--on-ink-dim);letter-spacing:.04em}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;display:flex;align-items:center;gap:14px;background:var(--shell);border-bottom:1px solid var(--line);padding:10px var(--gut);min-height:58px}
.top .today{color:var(--slate);font-weight:600;font-size:14px}
.top .sp{flex:1}
.top .who{text-align:right;line-height:1.2;white-space:nowrap}
.top .who b{display:block;color:var(--ink);font-size:14.5px}
.top .who small{color:var(--slate);font-size:12.5px}
.top select{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--ink);max-width:38vw}
.menu-m{display:none;background:none;border:0;padding:6px;border-radius:9px;color:var(--ink)}
.work{flex:1;overflow:auto;padding-block:26px 80px;display:flex;flex-direction:column;gap:18px}
.work>*{margin-inline:var(--gut);flex:none}
.scrim{display:none}

@media (min-width:901px){
  .app.mini{grid-template-columns:68px minmax(0,1fr)}
  .app.mini .nav{padding-inline:10px}
  .app.mini .brandrow{flex-direction:column;padding:0 0 12px}
  .app.mini .logo .txt,.app.mini .ni .lb,.app.mini .ni .chev,.app.mini .ver,.app.mini .ni.grp{display:none}
  .app.mini .ni{justify-content:center;padding:11px 0;position:relative}
  .app.mini .ni.sub svg{display:block}
  .app.mini .kids{border-top:1px solid var(--on-ink-line);margin-top:6px;padding-top:6px}
  .app.mini .ni .b{position:absolute;top:7px;right:11px;width:9px;height:9px;padding:0;font-size:0}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;inset:0 auto 0 0;width:268px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .app.drawer .nav{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:20}
  .navbtn{display:none}
  .menu-m{display:flex}
  .top .today{display:none}
}
@media (max-width:560px){.top [data-act=signout]{display:none}}
@media (prefers-reduced-motion:reduce){.nav,.ni .chev{transition:none}}

/* page parts */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
.head .sub{color:var(--slate);margin-top:5px;font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.band{margin-inline:0;background:var(--shell);border-top:4px solid var(--teal);border-bottom:1px solid var(--line);padding:22px var(--gut);display:flex;gap:22px 44px;flex-wrap:wrap;align-items:flex-end}
.band .lab,.band .side span,.band .holders span{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--slate)}
.band .big{font-weight:800;font-size:clamp(38px,4.4vw,56px);line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.band .big small{font-size:.34em;font-weight:700;color:var(--slate);margin-right:8px;letter-spacing:.05em}
.band .big.neg{color:var(--clay)}
.band .side,.band .holders{display:flex;gap:16px 34px;flex-wrap:wrap;padding-bottom:6px}
.band .side strong,.band .holders strong{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.band .side .in strong{color:var(--teal)} .band .side .out strong,.band .holders .neg strong{color:var(--clay)}
.band .holders{margin-left:auto;padding-left:34px;border-left:1px solid var(--line)}
.band .holders strong{font-size:17px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.bar #pcAp{margin-left:auto}
.step{display:inline-flex;align-items:center;background:var(--shell);border:1px solid var(--line);border-radius:12px;padding:3px}
.step button{border:0;background:none;width:34px;height:34px;border-radius:9px;font-size:20px;line-height:1;color:var(--ink)}
.step button:hover{background:var(--paper)}
.step button[disabled]{opacity:.3;cursor:default}
.step .d{padding:0 12px;font-weight:700;color:var(--ink);white-space:nowrap}
.pills{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--shell);border:1px solid var(--line);border-radius:12px;padding:4px}
.pills button{border:0;background:none;border-radius:9px;padding:7px 11px;font-weight:600;color:var(--slate);display:flex;align-items:center;gap:7px;white-space:nowrap}
.pills button:hover{background:var(--paper)}
.pills button[aria-pressed=true]{background:var(--ink);color:var(--white)}
.pills .q{background:var(--gold-wash);color:var(--gold);border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 7px;font-variant-numeric:tabular-nums}
.pills button[aria-pressed=true] .q{background:var(--on-ink-line);color:var(--white)}
.inp{background:var(--shell);border:1px solid var(--line);border-radius:var(--r-ctl);padding:9px 12px;min-width:0;width:100%;color:var(--ink)}
.inp:disabled{background:var(--paper);color:var(--slate)}
.srch{flex:1 1 120px;max-width:320px}
.bar select.inp{width:auto}
.err{border-color:var(--clay)!important;background:var(--clay-wash)!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--shell);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:700;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--paper)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--white)} .btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.ok{background:var(--teal);border-color:var(--teal);color:var(--white)} .btn.ok:hover{background:var(--teal-dark);border-color:var(--teal-dark)}
.btn.bad{background:var(--clay);border-color:var(--clay);color:var(--white)} .btn.bad:hover{background:var(--clay-dark)}
.btn.warn{background:var(--gold-wash);border-color:var(--gold-pure);color:var(--gold)} .btn.warn:hover{background:var(--gold-pure);color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:default}
.act{background:none;border:0;padding:5px 9px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap}
.act:hover{background:var(--paper-2)}
.act.ok{color:var(--teal)} .act.ok:hover{background:var(--teal-wash)}
.act.bad{color:var(--clay)} .act.bad:hover{background:var(--clay-wash)}
.act.warn{color:var(--gold)} .act.warn:hover{background:var(--gold-wash)}
.act.plain{color:var(--slate)} .act.plain:hover{background:var(--paper)}
.tacts{display:flex;gap:2px;justify-content:flex-end;flex-wrap:nowrap}

/* tables */
.tbl{background:var(--shell);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.tcap{padding:14px 16px 4px;font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--ink)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--slate);text-align:left;padding:12px 16px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--paper)}
tr.editing td,tr.editing:hover td{background:var(--teal-wash)}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
td.tot{font-weight:800;color:var(--ink)}
td.neg{color:var(--clay)}
td.item{font-weight:600;color:var(--ink)}
td .note{display:block;font-weight:400;font-size:13px;color:var(--slate)}
tfoot td{background:var(--paper-2);font-weight:700;color:var(--ink);border-bottom:0;border-top:1px solid var(--line)}
td.empty{color:var(--slate);padding:26px 16px}
.reg{display:inline-flex;align-items:baseline;gap:7px;font-weight:700;color:var(--ink);background:var(--paper-2);border-radius:7px;padding:3px 9px;font-size:13.5px;letter-spacing:.03em;white-space:nowrap}
.reg i{font-style:normal;font-weight:600;color:var(--slate);font-size:12.5px;letter-spacing:0;font-variant-numeric:tabular-nums}
.splitv{display:flex;gap:5px;flex-wrap:wrap;max-width:330px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.wait{background:var(--gold-wash);color:var(--gold)}
.chip.ok{background:var(--teal-wash);color:var(--teal)}
.chip.bad{background:var(--clay-wash);color:var(--clay)}
.chip.mute{background:var(--paper-2);color:var(--ink-2)}
.due{color:var(--slate);font-size:13px}
.cb{width:17px;height:17px;accent-color:var(--teal);vertical-align:middle}
.cell{width:78px;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--shell);font-variant-numeric:tabular-nums}
.cell.wide{width:120px}
.cellr{display:block;width:78px;margin:4px 0 0 auto;font-size:12.5px;padding:4px 5px;border-radius:8px;border:1px solid var(--gold-pure);background:var(--gold-wash);color:var(--gold)}
td.ed{padding:7px 8px}
.rowin{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--shell);max-width:100%}
.errrow td,.errrow:hover td{background:var(--clay-wash);color:var(--clay);font-weight:600;padding:9px 16px}
.grid th:first-child,.grid td:first-child:not([colspan]){position:sticky;left:0;z-index:1;background:var(--shell)}
.errrow span{position:sticky;left:16px;display:inline-block}
.grid tr:hover td:first-child{background:var(--paper)}
.grid tr.editing td:first-child{background:var(--teal-wash)}
.grid tfoot td:first-child{background:var(--paper-2)}
.grid th.today{color:var(--teal)}
.prog{display:flex;align-items:center;gap:10px;min-width:150px}
.prog .t{flex:1;height:7px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.prog .t i{display:block;height:100%;border-radius:99px;background:var(--teal-mid)}
.prog .t i.full{background:var(--teal)}
.prog span{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--slate);white-space:nowrap}

/* cards, dashboard */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--shell);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;min-width:0}
.card .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card .ch .sub{color:var(--slate);font-size:13.5px;margin-top:3px}
.rank{display:grid;grid-template-columns:auto minmax(60px,1fr) auto;gap:9px 14px;align-items:center}
.rank .trk{position:relative;height:18px;background:var(--paper);border-radius:5px}
.rank .trk i{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--teal)}
.rank .trk i.neg{background:var(--clay)}
.rank .trk u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--slate)}
.rank .v{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.rank .v.neg{color:var(--clay)}
.lines{display:flex;flex-direction:column}
.lines .ln{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.lines .ln:last-child{border-bottom:0}
.lines .ln .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.lines .ln b{color:var(--ink);font-variant-numeric:tabular-nums}
.lines .ln b.neg{color:var(--clay)}
.muted{color:var(--slate)}

.plist button{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;border-radius:9px;padding:9px 12px;text-align:left;font-weight:600;color:var(--ink);white-space:nowrap}
.plist button:hover{background:var(--paper)}
.plist button[aria-checked=true]{background:var(--teal-wash);color:var(--teal);font-weight:700}
.plist button[aria-checked=true]::after{content:"\2713";font-weight:800}
.pcustom{border-top:1px solid var(--line-soft);padding:12px 6px 4px;display:flex;flex-direction:column;gap:10px}
.pcustom .inp{padding:8px 6px;font-size:14px}
.dsel{display:grid;grid-template-columns:62px minmax(0,1fr) 76px;gap:6px}
.band .step button:not(.d){width:30px}
tr.grp td,tr.grp:hover td{background:var(--paper-2);padding-block:7px;font-weight:700;color:var(--ink)}
tr.grp div{display:flex;justify-content:space-between;gap:16px}
tr.grp div span:last-child{font-weight:600;color:var(--slate);font-variant-numeric:tabular-nums}
.pcustom .ferr[hidden]{display:none}
.mb .hint:empty{display:none}
.mb #sRule{line-height:1.4}

/* ===== v2.23: the vehicles a person can see ===== */
.checks[hidden],.vgrid[hidden]{display:none}
.vgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center}
.cogrp{font-weight:700;color:var(--ink);font-size:13.5px;white-space:nowrap}
@media (max-width:820px){.vgrid{grid-template-columns:minmax(0,1fr)}}

/* ===== v2.25: filters and export on the headline bar; savings opening balance ===== */
.band .btools{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:1 1 320px;min-width:0;margin-left:auto}
.band .btools .inp{background:var(--glass);border-color:var(--glass-line);color:var(--white);font-weight:600;padding:8px 11px}
.band .btools select.inp{width:auto;flex:none}
.band .btools select.inp option{background:var(--shell);color:var(--ink)}
.band .btools .srch{flex:1 1 130px;max-width:230px}
.band .btools .inp::placeholder{color:var(--on-deep)}
.band .btools .btn{flex:none;padding-inline:15px}
.orow{display:flex;align-items:center;gap:10px}
.orow .dsel{flex:1;max-width:360px;grid-template-columns:80px minmax(0,1fr) 98px}
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.ocell{display:flex;align-items:center;gap:8px}
.ocell .reg{flex:none}
.mb .ocell .inp{padding:7px 9px;font-size:14px;min-width:0}
.msum{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:var(--paper);border-radius:12px;padding:10px 16px}
.msum span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
.msum b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.msum i{font-style:normal;font-weight:700;color:var(--slate);font-size:17px}
.msum .t{margin-left:auto;text-align:right}
@media (max-width:700px){.ogrid{grid-template-columns:minmax(0,1fr)}}
td.nw .note{white-space:normal;min-width:150px}
#expT th,#expT td{padding-inline:11px}
#expT th:first-child,#expT td:first-child{padding-left:16px}

/* ===== v2.26: bars, tabs and tiles share the table's edges ===== */
.band .bacts{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.tabs{grid-template-columns:minmax(0,1fr)}}

/* ===== v2.27: the headline bar is as wide as the working sheet; its contents keep the table's gutter ===== */
.hero>.band,.hero>.hrow{margin-inline:calc(-1*var(--gut))}
.hero .band,.hero .band.eq{padding-inline:var(--gut);border-radius:24px}
.hero>.hrow .menu-m{margin-left:var(--gut)}
.band .btools{flex-basis:300px}
.band .btools .srch{min-width:120px}
.band{gap:6px 18px}
.band .side{gap:6px 18px}

/* ===== v2.28: tables reach both edges of the sheet; one smaller side margin shared by everything ===== */
:root{--gut:clamp(16px,1.7vw,28px)}
.pagebody{padding-inline:0}
.pagebody>*{margin-inline:var(--gut)}
.pagebody>.tbl,.pagebody>#expT,.pagebody>#revT,.pagebody>#repT,.pagebody>#pcT{margin-inline:0}
.pagebody>.tbl,.pagebody>[id$="T"] .tbl{border-left:0;border-right:0;border-radius:0}

.pagebody>.tbl th:last-child,.pagebody>.tbl td:last-child,.pagebody>[id$="T"] th:last-child,.pagebody>[id$="T"] td:last-child,#expT th:last-child,#expT td:last-child{padding-right:var(--gut)}
.pagebody{overflow:hidden}
.pagebody:has(>.tbl:first-child),.pagebody:has(>[id$="T"]:first-child){padding-top:0}
.pagebody>.tbl:first-child,.pagebody>[id$="T"]:first-child .tbl{border-top:0}
.pagebody>.tbl:first-child th,.pagebody>[id$="T"]:first-child th{padding-top:16px}

/* standing orders: a schedule posts in full on its run date and never before it. A posted run is a record of
   its own, so changing or pausing the schedule later does not touch what has already run. */
function runsOn(s,d){ var x=dt(d); return s.freq==='daily'?true:s.freq==='weekly'?DOW[x.getUTCDay()]===s.day:s.freq==='monthly'?x.getUTCDate()===s.dom:(x.getUTCDate()===s.dom&&x.getUTCMonth()===s.mon); }
function runDates(s,from,to){ var out=[]; for(var d=from>s.since?from:s.since; d<=to; d=add(d,1)){ if(runsOn(s,d)) out.push(d); } return out; }

/* A saving may carry a revenue rule, cond = {min, days}: the vehicle saves only if its revenue over the `days`
   ending on the run date is `min` or more. The run is decided once every day in that window has a revenue
   record. Until then it waits (held). A decided run is never reopened by later edits to revenue. */
function condCheck(s,reg,d){
  var v=veh(reg), from=add(d,-(s.cond.days-1)), rev=0, miss=0, x, k;
  for(k=from>v.since?from:v.since; k<=d; k=add(k,1)){ x=REV[reg+'|'+k]; if(x&&x.amt) rev+=x.amt; else if(!(x&&x.reason)) miss++; }
  return {rev:rev,state:miss?'held':rev>=s.cond.min?'saved':'skipped'};
}
function postRun(s,d){
  VEH.forEach(function(v){
    if(!(s.regs==='all'||s.regs.indexOf(v.reg)>=0)||v.since>d) return;
    if(s.kind==='saving'){
      var c=s.cond?condCheck(s,v.reg,d):{rev:0,state:'saved'};
      SAVED.push({id:SEQ++,sid:s.id,date:d,name:s.name,alloc:[{reg:v.reg,amt:s.amt}],state:c.state,rev:c.rev,need:s.cond?s.cond.min:0,days:s.cond?s.cond.days:0});
    }
    else EXP.push({id:SEQ++,sid:s.id,date:d,item:s.item,qty:1,cost:s.amt,alloc:[{reg:v.reg,amt:s.amt}],src:'sched',by:''});
  });
}

/* A saving may start with an opening balance brought in from another system: open = {date, amts:{reg: KES}}.
   The balance of a saving for a vehicle is that opening amount plus every saved run dated after the opening date. */
function saveBal(q,reg,upto){
  var o=q.open, b=o&&o.amts[reg]&&(!upto||o.date<=upto)?o.amts[reg]:0;
  SAVED.forEach(function(x){ if(x.sid===q.id&&x.state==='saved'&&x.alloc[0].reg===reg&&(!o||x.date>o.date)&&(!upto||x.date<=upto)) b+=x.alloc[0].amt; });
  return b;
}
function settleSavings(){
  var n=0;

    if(x.state!=='held') return;
    var q=SCHED.filter(function(y){ return y.id===x.sid; })[0], c=q&&q.cond?condCheck(q,x.alloc[0].reg,x.date):{rev:x.rev,state:'saved'};
    x.rev=c.rev; if(c.state!=='held'){ x.state=c.state; n++; }

}

function rangeLabel(a,b){
  var x=dt(a), y=dt(b);
  if(a===b) return dmy(a);
  if(x.getUTCFullYear()!==y.getUTCFullYear()) return dmy(a)+' to '+dmy(b);
  if(x.getUTCMonth()!==y.getUTCMonth()) return x.getUTCDate()+' '+MON[x.getUTCMonth()]+' to '+dmy(b);

/* A period is {from, to, unit}. unit says how previous and next move: day, week, four (weeks), month, custom. */
var PRESETS=[['today','Today'],['yest','Yesterday'],['this','This week'],['last','Last week'],['four','Last 4 weeks'],['month','This month'],['lastm','Last month']];
function preset(id){
  var ws=wk(TODAY), x=dt(TODAY), y=x.getUTCFullYear(), m=x.getUTCMonth();
  var mo=function(k){ return {from:iso(new Date(Date.UTC(y,m+k,1))),to:iso(new Date(Date.UTC(y,m+k+1,0))),unit:'month'}; };
  return id==='today'?{from:TODAY,to:TODAY,unit:'day'}:id==='yest'?{from:add(TODAY,-1),to:add(TODAY,-1),unit:'day'}
    :id==='this'?{from:ws,to:add(ws,6),unit:'week'}:id==='last'?{from:add(ws,-7),to:add(ws,-1),unit:'week'}
    :id==='four'?{from:add(ws,-28),to:add(ws,-1),unit:'four'}:id==='month'?mo(0):mo(-1);
}
function perLabel(P){ var x=dt(P.from); return P.from===P.to?sdmy(P.from):P.unit==='month'?MON[x.getUTCMonth()]+' '+x.getUTCFullYear():rangeLabel(P.from,P.to); }

function period(p){

    return {from:p.from,to:p.to,weeks:(Math.round((dt(p.to)-dt(p.from))/864e5)+1)/7,cur:p.unit==='week'&&p.from===ws,range:perLabel(p),

  }

  else if(p==='last') R={from:add(ws,-7),to:add(ws,-1),weeks:1,label:'week of '+dmy(add(ws,-7))};

function vstat(reg,R){
  var v=veh(reg), o={reg:reg,co:v.co,rev:0,target:Math.round(v.target*R.weeks),cap:0,norev:0,gaps:0,rep:0,rec:0,loan:0,other:0,saved:0};
  for(var d=R.from>v.since?R.from:v.since; d<=R.to&&d<=TODAY; d=add(d,1)){
    var x=REV[reg+'|'+d];
    if(x&&x.amt){ o.rev+=x.amt; o.cap++; } else if(x&&x.reason){ o.norev++; } else if(d<TODAY){ o.gaps++; }
  }
  function addc(id,amt){ var c=item(id).cat; o[(c==='rep'||c==='rec'||c==='loan')?c:'other']+=amt; }
  function scan(list,ok){ list.forEach(function(e){ if(ok(e)&&e.date>=R.from&&e.date<=R.to) e.alloc.forEach(function(a){ if(a.reg===reg) addc(e.item,a.amt); }); }); }
  scan(PC,function(e){ return e.status==='approved'; });
  scan(EXP,function(){ return true; });
  SAVED.forEach(function(x){ if(x.state==='saved'&&x.date>=R.from&&x.date<=R.to) x.alloc.forEach(function(a){ if(a.reg===reg) o.saved+=a.amt; }); });

function pcStats(day,who){
  var ids = who==='all' ? holders().map(function(h){ return h.id; }) : [who];
  var opening=0;
  ids.forEach(function(id){
    var p=person(id), flow=function(date,amt){ if(date>=PC_BASE&&date<day) opening+=amt; else if(date<PC_BASE&&date>=day) opening-=amt; };
    opening += (p&&p.base)||0;
    PC.forEach(function(e){ if(e.who===id&&e.status!=='rejected') flow(e.date,-tot(e)); });
    CASH.forEach(function(c){ if(c.who===id) flow(c.date,c.kind==='issue'?c.amt:-c.amt); });
  });
  var lines=PC.filter(function(e){ return e.date===day&&ids.indexOf(e.who)>=0; });
  var cash=CASH.filter(function(c){ return c.date===day&&ids.indexOf(c.who)>=0; });
  var inn=sum(cash.filter(function(c){ return c.kind==='issue'; }),function(c){ return c.amt; });
  var cr=sum(cash.filter(function(c){ return c.kind==='credit'; }),function(c){ return c.amt; });
  var out=sum(lines.filter(function(e){ return e.status!=='rejected'; }),tot);
  var wait=sum(lines.filter(function(e){ return e.status==='waiting'; }),tot);
  return {lines:lines,cash:cash,opening:opening,inn:inn,credit:cr,out:out,wait:wait,closing:opening+inn-cr-out};
}

function pcRange(from,to,who){

  var ids=who==='all'?holders().map(function(h){ return h.id; }):[who];
  var inR=function(x){ return x.date>=from&&x.date<=to&&ids.indexOf(x.who)>=0; }, byDate=function(a,b){ return a.date<b.date?-1:a.date>b.date?1:a.id-b.id; };
  var lines=PC.filter(inR).sort(byDate), cash=CASH.filter(inR).sort(byDate), amt=function(c){ return c.amt; };
  var inn=sum(cash.filter(function(c){ return c.kind==='issue'; }),amt), cr=sum(cash.filter(function(c){ return c.kind==='credit'; }),amt);
  var out=sum(lines.filter(function(e){ return e.status!=='rejected'; }),tot), wait=sum(lines.filter(function(e){ return e.status==='waiting'; }),tot);
  return {lines:lines,cash:cash,opening:st.opening,inn:inn,credit:cr,out:out,wait:wait,closing:st.opening+inn-cr-out};
}

      + (allowed('reports')?'<button type="button" class="btn sm" data-act="go" data-view="reports">Open reports</button>':'')+'</div><div class="rank">';

/* the float balance is always whole; the entries listed are only those on vehicles this person can see */
function pcNow(){
  var P=S.per.pc, st=pcRange(P.from,P.to,pcWho()), vis=st.lines.filter(function(e){ return sees(e.alloc[0].reg); });
  return {lines:vis,hidden:st.lines.length-vis.length,cash:st.cash,opening:st.opening,inn:st.inn,credit:st.credit,out:st.out,closing:st.closing,
    wait:sum(vis.filter(function(e){ return e.status==='waiting'; }),tot)};
}
function pcApproveBtn(){
  var st=pcNow(), P=S.per.pc, ids=Object.keys(S.pcSel).filter(function(k){ return S.pcSel[k]; });
  var sel=st.lines.filter(function(e){ return e.status==='waiting'&&ids.indexOf(String(e.id))>=0; });
  if(sel.length&&has('pc.approve_item')) return '<button type="button" class="btn ok" id="pcAp" data-act="pcapprovesel">Approve '+sel.length+', '+money(sum(sel,tot))+'</button>';
  if(!has('pc.approve_day')) return '<span id="pcAp"></span>';
  return '<button type="button" class="btn ok" id="pcAp" data-act="pcapproveall"'+(st.wait?'':' disabled')+'>Approve '+(P.from!==P.to?'all':pcWho()==='all'?'day':'these')+(st.wait?', '+money(st.wait):'')+'</button>';
}
function splitNote(e){ return e.grp?'Shared by '+e.of+' vehicles, '+money(e.gtot)+' in all':''; }
function pcNotes(e){ return [e.status==='rejected'?e.why:'',e.status==='waiting'&&e.reopened?'Reopened, '+e.reopened:'',splitNote(e)].filter(Boolean); }
function pcMatch(hay){
  var q=S.pcQ.trim().toLowerCase(); if(!q) return true;
  hay=hay.join(' ').toLowerCase();
  return q.split(/\s+/).every(function(t){ return hay.indexOf(t)>=0; });
}
function pcLines(st){
  return st.lines.filter(function(e){
    if(S.pcStatus!=='all'&&e.status!==S.pcStatus) return false;
    return pcMatch([dmy(e.date),e.alloc[0].reg,item(e.item).name,cat(item(e.item).cat).name,pname(e.who),e.status,e.qty,e.cost,kes(e.cost),tot(e),kes(tot(e))].concat(pcNotes(e)));
  });
}
function pcCash(st){
  return st.cash.filter(function(c){ return pcMatch([dmy(c.date),c.kind==='issue'?'cash issued':'credit note',pname(c.who),c.note,c.amt,kes(c.amt)]); });
}
function dayRow(date,note,span){ return '<tr class="grp"><td colspan="'+span+'"><div><span>'+wdmy(date)+'</span><span>'+note+'</span></div></td></tr>'; }
function pcTables(){
  if(S.pcView==='rep') return repTable(currentReport());
  var st=pcNow(), P=S.per.pc, multi=P.from!==P.to, can=has('pc.approve_item'), filtered=S.pcQ.trim()||S.pcStatus!=='all', h, last='';
  if(S.pcView==='cash'){
    var cash=pcCash(st), inn=0, out=0;
    h='<div class="tbl"><div class="scroll"><table><thead><tr><th>Type</th><th>Manager</th><th>Reason</th><th class="r">In</th><th class="r">Out</th></tr></thead><tbody>';
    cash.forEach(function(c){
      if(multi&&c.date!==last){ last=c.date; h+=dayRow(c.date,'Net cash received '+kes(sum(cash.filter(function(x){ return x.date===c.date; }),function(x){ return x.kind==='issue'?x.amt:-x.amt; })),5); }
      if(c.kind==='issue') inn+=c.amt; else out+=c.amt;
      h+='<tr><td>'+(c.kind==='issue'?'Cash issued':'<span class="chip bad">Credit note</span>')+'</td><td class="nw">'+esc(pname(c.who))+'</td><td>'+esc(c.note)+'</td>'
        + '<td class="r tot">'+(c.kind==='issue'?kes(c.amt):'')+'</td><td class="r tot neg">'+(c.kind==='credit'?kes(c.amt):'')+'</td></tr>';
    });
    if(!cash.length) h+='<tr><td class="empty" colspan="5">'+(S.pcQ.trim()?'Nothing matches.':'No cash moved.')+'</td></tr>';
    return h+'</tbody><tfoot><tr><td colspan="3">Net cash received</td><td class="r" colspan="2">'+kes(inn-out)+'</td></tr></tfoot></table></div></div>';
  }
  var lines=pcLines(st), span=can?9:8;
  h='<div class="tbl"><div class="scroll"><table><thead><tr>'+(can?'<th style="width:38px"><span class="sr">Select</span></th>':'')
    + '<th>Vehicle</th><th>Item</th><th class="r">Qty</th><th class="r">Unit cost</th><th class="r">Total amount</th><th>Manager</th><th>Status</th><th class="r">Actions</th></tr></thead><tbody>';
  lines.forEach(function(e){
    var w=e.status==='waiting';
    if(multi&&e.date!==last){
      last=e.date; var dl=lines.filter(function(x){ return x.date===e.date; });
      h+=dayRow(e.date,dl.length+' entr'+(dl.length===1?'y':'ies')+', KES '+kes(sum(dl.filter(function(x){ return x.status!=='rejected'; }),tot)),span);
    }
    h+='<tr>'+(can?'<td>'+(w?'<input class="cb" type="checkbox" data-in="pcsel" data-id="'+e.id+'"'+(S.pcSel[e.id]?' checked':'')+' aria-label="Select entry">':'')+'</td>':'')
      + '<td><span class="reg">'+esc(e.alloc[0].reg)+'</span></td>'
      + '<td class="item">'+esc(item(e.item).name)+pcNotes(e).map(function(n){ return '<span class="note">'+esc(n)+'</span>'; }).join('')+'</td>'
      + '<td class="r">'+e.qty+'</td><td class="r">'+kes(e.cost)+'</td><td class="r tot">'+kes(tot(e))+'</td>'
      + '<td class="nw">'+esc(pname(e.who))+'</td><td>'+chip(e)+'</td><td class="r"><div class="tacts">';
    if(w){
      if(has('pc.edit')||(e.who===S.user.id&&has('pc.spend'))) h+='<button type="button" class="act" data-act="pcedit" data-id="'+e.id+'">Edit</button>';
      if(has('pc.reject')) h+='<button type="button" class="act bad" data-act="pcreject" data-id="'+e.id+'">Reject</button>';
      if(can) h+='<button type="button" class="act ok" data-act="pcapprove" data-id="'+e.id+'">Approve</button>';
    } else if(has('pc.reopen')) h+='<button type="button" class="act warn" data-act="pcreopen" data-id="'+e.id+'">Reopen</button>';
    h+='</div></td></tr>';
  });
  if(!lines.length) h+='<tr><td class="empty" colspan="9">'+(filtered?'Nothing matches.':'No expenses recorded.')+'</td></tr>';
  var shown=sum(lines.filter(function(e){ return e.status!=='rejected'; }),tot);
  return h+'</tbody><tfoot><tr><td colspan="'+(can?5:4)+'">Expenses, '+lines.length+' entr'+(lines.length===1?'y':'ies')+(st.hidden?'<span class="note">'+st.hidden+' more on vehicles outside your access</span>':'')+'</td><td class="r">'+kes(shown)+'</td><td colspan="3"></td></tr></tfoot></table></div></div>';
}
/* petty cash top is one bar, as wide as the table: date, the balance sum, then the action and profile */
function pcRow(bandHtml,acts){
  var bh=bandHtml.replace('<!--band-->','').replace('<!--/band-->',''), i=bh.lastIndexOf('</section>');
  return '<div class="hrow">'+menuBtn()+'<h1 class="sr">Petty cash</h1>'+bh.slice(0,i)+'<div class="bacts">'+acts+profBtn()+'</div></section></div><!--hero-end-->';
}
/* Cash balance = Opening balance + Cash issued − Expenses − Credit notes */
function pcBand(st,lab,pre){
  var t=function(l,v){ return '<div class="t"><span>'+l+'</span><strong>'+kes(v)+'</strong></div>'; }, op=function(o){ return '<span class="op" aria-hidden="true">'+o+'</span>'; };
  return '<section class="band eq" aria-label="Cash balance equals opening balance plus cash issued minus expenses minus credit notes"><div class="dbar">'+pre+'</div>'
    + '<div class="eqn"><div class="t main"><div class="lab">'+lab+'</div><div class="big'+(st.closing<0?' neg':'')+'"><small>KES</small>'+kes(st.closing)+'</div></div>'
    + op('=')+t('Opening balance',st.opening)+op('+')+t('Cash issued',st.inn)+op('−')+t('Expenses',st.out)+op('−')+t('Credit notes',st.credit)+'</div></section>';
}
function viewPettycash(){
  if(S.pcView==='rep'&&!has('pc.reports')) S.pcView='exp';
  var who=pcWho(), st=pcNow(), all=who==='all', v=S.pcView, a='';
  var tog='<div class="pills" role="group" aria-label="View"><button type="button" data-act="pcview" data-v="exp" aria-pressed="'+(v==='exp')+'">Expenses<span class="q n">'+st.lines.length+'</span></button>'
    + '<button type="button" data-act="pcview" data-v="cash" aria-pressed="'+(v==='cash')+'">Cash received<span class="q n">'+st.cash.length+'</span></button>'
    + (has('pc.reports')?'<button type="button" data-act="pcview" data-v="rep" aria-pressed="'+(v==='rep')+'">Reports</button>':'')+'</div>';
  var mgr=has('pc.view')?'<select class="inp" id="pcWhoSel" data-in="pcwhosel" aria-label="Manager">'+opts([['all','All managers']].concat(holders().map(function(p){ return [p.id,pname(p.id)]; })),who)+'</select>':'';
  var srch='<input class="inp srch" type="search" id="pcQ" data-in="pcq" placeholder="Search" value="'+esc(S.pcQ)+'" aria-label="Search everything shown">';
  if(v==='rep'){
    var d=currentReport(), noP=S.pcRep==='pcwait';
    return pcRow(band(d.hero[0],d.hero[1],d.side,'',d.plain,noP?'':perBar('pcrep')),'')
      + '<div class="bar">'+tog+'<select class="inp" id="pcRepSel" data-in="pcrepsel" aria-label="Report">'+opts(PCREPORTS,S.pcRep)+'</select>'+mgr+srch+'<span class="sp"></span>'+expBtn()+'</div>'
      + '<div id="pcT" class="stack">'+repTable(d)+'</div>';
  }
  if(v==='exp'){ if(has('pc.spend')) a='<button type="button" class="btn pri" data-act="pcnew">Record spending</button>'; }
  else {
    if(has('pc.credit')) a+='<button type="button" class="btn" data-act="pccash" data-kind="credit">Credit note</button>';
    if(has('pc.issue')) a+='<button type="button" class="btn pri" data-act="pccash" data-kind="issue">Issue cash</button>';
  }
  var h=pcRow(pcBand(st,all?'Cash balance':has('pc.view')?'Cash balance, '+esc(pname(who)):'My cash balance',perBar('pc')),a);
  h+='<div class="bar">'+tog+mgr+srch+'<span class="sp"></span>'+expBtn()+(v==='exp'?pcApproveBtn():'')+'</div>';
  return h+'<div id="pcT" class="stack">'+pcTables()+'</div>';
}

/* ================= central expenses ================= */
/* The ledger every expense lands in: recorded here by someone with the right, approved in petty cash,
   or posted by a schedule on its run date. */
function ledger(R){
  var out=EXP.filter(function(e){ return e.date>=R.from&&e.date<=R.to; });
  PC.forEach(function(e){ if(e.status==='approved'&&e.date>=R.from&&e.date<=R.to) out.push({id:e.id,date:e.date,item:e.item,qty:e.qty,cost:e.cost,alloc:e.alloc,src:'pc',by:e.who,grp:e.grp,of:e.of,gtot:e.gtot}); });
  return out;
}
function expList(raw){
  var R=period(S.per.exp), ts=raw?[]:S.expQ.trim().toLowerCase().split(/\s+/).filter(Boolean), regsIn=V().map(function(v){ return v.reg; });
  return ledger(R).map(function(e){ return {e:e,reg:e.alloc[0].reg,amt:e.alloc[0].amt}; }).filter(function(x){
    if(regsIn.indexOf(x.reg)<0) return false;
    if(raw) return true;
    if(S.expSrc!=='all'&&x.e.src!==S.expSrc) return false;
    if(!ts.length) return true;
    var hay=[dmy(x.e.date),x.reg,item(x.e.item).name,cat(item(x.e.item).cat).name,srcName(x.e.src),x.e.by?pname(x.e.by):'standing order',x.amt,kes(x.amt),splitNote(x.e)].join(' ').toLowerCase();
    return ts.every(function(t){ return hay.indexOf(t)>=0; });
  }).sort(function(a,b){ return a.e.date<b.e.date?1:a.e.date>b.e.date?-1:b.e.id-a.e.id; });
}
function expTable(){
  var list=expList(), canPc=allowed('pettycash');
  var h='<div class="tbl"><div class="scroll"><table><thead><tr><th>Date</th><th>Vehicle</th><th>Item</th><th class="r">Qty</th><th class="r">Unit cost</th><th class="r">Total amount</th><th>Source</th><th>Recorded by</th><th class="r">Actions</th></tr></thead><tbody>';
  list.forEach(function(x){
    var e=x.e, sc=e.src==='sched', sn=splitNote(e);
    h+='<tr><td class="nw">'+dmy(e.date)+'</td><td><span class="reg">'+esc(x.reg)+'</span></td><td class="item nw">'+esc(item(e.item).name)+(sn?'<span class="note">'+sn+'</span>':'')+'</td>'
      + '<td class="r">'+e.qty+'</td><td class="r">'+kes(e.cost)+'</td><td class="r tot">'+kes(x.amt)+'</td>'
      + '<td><span class="chip mute">'+srcName(e.src)+'</span></td><td class="nw">'+(sc?'<span class="muted">Standing order</span>':esc(pname(e.by)))+'</td><td class="r"><div class="tacts">';
    if(e.src==='central'&&has('exp.edit')) h+='<button type="button" class="act" data-act="expedit" data-id="'+e.id+'">Edit</button>';
    else if(e.src==='pc'&&canPc) h+='<button type="button" class="act plain" data-act="exppc" data-d="'+e.date+'">Open day</button>';
    h+='</div></td></tr>';
  });
  if(!list.length) h+='<tr><td class="empty" colspan="9">'+(S.expQ.trim()||S.expSrc!=='all'?'Nothing matches.':'No expenses in this period.')+'</td></tr>';
  return h+'</tbody><tfoot><tr><td colspan="5">'+list.length+' expense'+(list.length===1?'':'s')+'</td><td class="r">'+kes(sum(list,function(x){ return x.amt; }))+'</td><td colspan="3"></td></tr></tfoot></table></div></div>';
}
var SOURCES=[['all','All sources'],['central','Central'],['pc','Petty cash'],['sched','Scheduled']];
function viewExpenses(){
  var all=expList(true), by=function(k){ return sum(all.filter(function(x){ return x.e.src===k; }),function(x){ return x.amt; }); };

        '<div class="btools"><select class="inp" id="expSrc" data-in="expsrc" aria-label="Source">'+opts(SOURCES,S.expSrc)+'</select>'
        + '<input class="inp srch" type="search" id="expQ" data-in="expq" placeholder="Search" value="'+esc(S.expQ)+'" aria-label="Search everything shown">'+expBtn()+'</div>',false,perBar('exp'))
    + '<div id="expT">'+expTable()+'</div>';
}

/* ================= spending and expense form ================= */
function newForm(mode){
  var who=mode==='pc'?(has('pc.view')&&S.pcWho!=='all'?S.pcWho:(S.user.float?S.user.id:(holders()[0]||{}).id)):'';
  return {modal:true,mode:mode,date:mode==='pc'?pcDay():TODAY,who:who,item:'',qty:1,cost:'',rows:[{reg:'',amt:0}]};
}
function syncForm(){
  var F=S.F; if(!F||!$('fItem')) return;
  if($('fDate')) F.date=val('fDate'); if($('fWho')) F.who=val('fWho'); F.item=val('fItem'); F.qty=num(val('fQty')); F.cost=num(val('fCost'));
  F.rows.forEach(function(r,k){ r.reg=val('fr-'+k); r.amt=num(val('fa-'+k)); });
}
function paintForm(){
  var F=S.F, t=F.qty*F.cost;
  $('fTot').textContent=money(t);
  if(F.rows.length===1){ F.rows[0].amt=t; $('fa-0').value=t||''; }
  var s=sum(F.rows,function(r){ return r.amt; }), seen={}, dup=false, miss=false;
  F.rows.forEach(function(r){ if(!r.reg) miss=true; else if(seen[r.reg]) dup=true; seen[r.reg]=1; });
  var b=$('fBal'), ok=F.item&&t>0&&!miss&&!dup&&s===t&&(F.mode!=='pc'||F.who);
  b.innerHTML = (!t||(F.rows.length===1&&!dup)) ? '' : dup ? '<span class="chip bad">The same vehicle is picked twice</span>'
    : s===t ? (miss?'':'<span class="chip ok">Balanced, '+money(t)+' across '+F.rows.length+' vehicle'+(F.rows.length===1?'':'s')+'</span>')
    : s<t ? '<span class="chip bad">'+money(t-s)+' left to allocate</span>' : '<span class="chip bad">'+money(s-t)+' over the total</span>';
  $('fSave').disabled=!ok; $('fSave').textContent=F.rows.length>1?'Save '+F.rows.length+' entries':'Save';
}
function comboChanged(){ if(S.F&&$('fItem')){ syncForm(); paintForm(); } else if(S.SF&&$('fItem')){ syncSF(); } }
function reF(){ openSpend(); }

/* ================= scheduled expenses and savings ================= */
function canSched(q){ return fullScope()||(q.regs!=='all'&&q.regs.every(sees)); }
function schedCount(s){ return V().filter(function(v){ return covers(s,v.reg); }).length; }
function monthSpan(){ var d=dt(TODAY), y=d.getUTCFullYear(), m=d.getUTCMonth(); return {from:iso(new Date(Date.UTC(y,m,1))),to:iso(new Date(Date.UTC(y,m+1,0))),label:MON[m]+' '+y}; }
function monthDue(s,n){ var ms=monthSpan(); return s.paused?0:runDates(s,ms.from,ms.to).length*s.amt*n; }
function winText(n){ return n===1?'that day':'over the '+n+' days to the run'; }
function ruleText(q){ return q.cond?'Revenue '+kes(q.cond.min)+' or more '+winText(q.cond.days):'Every run'; }
function savBal(q){ return sum(V().filter(function(v){ return covers(q,v.reg); }),function(v){ return saveBal(q,v.reg); }); }
function savedRows(q){ var regsIn=V().map(function(v){ return v.reg; }); return SAVED.filter(function(x){ return x.sid===q.id&&regsIn.indexOf(x.alloc[0].reg)>=0; }); }
function runTally(list){
  var c={saved:0,skipped:0,held:0}; list.forEach(function(x){ c[x.state]++; });
  return [c.saved?c.saved+' saved':'',c.skipped?c.skipped+' skipped':'',c.held?c.held+' waiting for revenue':''].filter(Boolean).join(', ');
}
function lastRun(q){
  var list=savedRows(q), last=''; list.forEach(function(x){ if(x.date>last) last=x.date; });
  return last?dmy(last)+'<span class="note">'+runTally(list.filter(function(x){ return x.date===last; }))+'</span>':'';
}
function viewScheduled(){
  var k=S.schedTab, exp=k==='expense', can=has('sched.add'), ms=monthSpan(), regsIn=V().map(function(v){ return v.reg; });
  var due=sum(SCHED.filter(function(q){ return q.kind==='expense'; }),function(q){ return monthDue(q,schedCount(q)); });
  var savedM=sum(SAVED.filter(function(x){ return x.state==='saved'&&x.date>=ms.from&&x.date<=ms.to&&regsIn.indexOf(x.alloc[0].reg)>=0; }),function(x){ return x.alloc[0].amt; });
  var list=SCHED.filter(function(q){ return q.kind===k&&schedCount(q); });
  var h=head('Scheduled expenses','',can?'<button type="button" class="btn pri" data-act="schednew">'+(exp?'New scheduled expense':'New saving')+'</button>':'');
  h+='<div class="tabs"><button type="button" class="tab" data-act="schedtab" data-k="expense" aria-pressed="'+exp+'"><span>Scheduled expenses</span><small>'+money(due)+' in '+ms.label+'</small></button>'
    + '<button type="button" class="tab" data-act="schedtab" data-k="saving" aria-pressed="'+!exp+'"><span>Savings</span><small>'+money(savedM)+' saved in '+ms.label+' · balance '+money(sum(SCHED.filter(function(q){ return q.kind==='saving'; }),savBal))+'</small></button></div>';
  h+='<div class="tbl"><div class="scroll"><table><thead><tr><th>'+(exp?'Item':'Saving')+'</th><th>Vehicles</th><th class="r">'+(exp?'Amount per vehicle':'Per vehicle')+'</th>'
    + (exp?'<th class="r">Each run</th><th>Runs</th>':'<th>Runs</th><th>Last run</th><th class="r">Balance</th>')+(exp?'<th>Next run</th>':'')+'<th>Status</th><th class="r">Actions</th></tr></thead><tbody>';
  list.forEach(function(q){
    var n=schedCount(q);
    h+='<tr><td class="item nw">'+esc(sname(q))+'</td><td>'+(q.regs==='all'?'All vehicles':'<div class="splitv">'+q.regs.map(function(r){ return '<span class="reg">'+esc(r)+'</span>'; }).join('')+'</div>')+'</td>'
      + '<td class="r">'+kes(q.amt)+'</td>'+(exp?'<td class="r tot">'+kes(q.amt*n)+'</td><td class="nw">'+when(q)+'</td>':'<td>'+when(q)+(q.cond?'<span class="note">'+ruleText(q)+'</span>':'')+'</td><td class="nw">'+lastRun(q)+'</td><td class="r tot">'+kes(savBal(q))+'</td>')
      + (exp?'<td class="nw">'+(q.paused?'':dmy(nextRun(q)))+'</td>':'')
      + '<td>'+(q.paused?'<span class="chip wait">Paused</span>':'<span class="chip ok">Running</span>')+'</td><td class="r"><div class="tacts">'
      + (exp?'':'<button type="button" class="act" data-act="schedruns" data-id="'+q.id+'">Runs</button>')
      + (has('sched.edit')&&canSched(q)?'<button type="button" class="act" data-act="schededit" data-id="'+q.id+'">Edit</button>':'')
      + (has('sched.pause')&&canSched(q)?'<button type="button" class="act '+(q.paused?'ok':'warn')+'" data-act="schedpause" data-id="'+q.id+'">'+(q.paused?'Resume':'Pause')+'</button>':'')+'</div></td></tr>';
  });
  if(!list.length) h+='<tr><td class="empty" colspan="9">Nothing scheduled.</td></tr>';
  return h+'</tbody>'+(exp||!list.length?'':'<tfoot><tr><td colspan="5">'+list.length+' saving'+(list.length===1?'':'s')+'</td><td class="r">'+kes(sum(list,savBal))+'</td><td colspan="2"></td></tr></tfoot>')+'</table></div></div>';
}
function syncSF(){
  var F=S.SF; if(!F||!$('sAmt')) return;
  if($('fItem')) F.item=val('fItem'); if($('sName')) F.name=val('sName');
  F.amt=num(val('sAmt')); F.freq=val('sFreq');
  if($('sDay')) F.day=val('sDay'); if($('sDom')) F.dom=num(val('sDom')); if($('sMon')) F.mon=num(val('sMon'));
  F.regs=$('sAll')&&$('sAll').checked?'all':VEH.filter(function(v,k){ var c=$('sv-'+k); return c&&c.checked; }).map(function(v){ return v.reg; });
  if($('sOpen')){
    if($('sOpen').checked){
      var o={date:$('sOpenDtD')?dateVal('sOpenDt'):(F.open?F.open.date:preset('lastm').to),amts:{}}, was=F.open?F.open.amts:{};
      VEH.forEach(function(v,k){
        var e=$('so-'+k), a=e?num(e.value):(was[v.reg]||0);
        if(a) o.amts[v.reg]=a;
      });
      F.open=o;

/* hand the file to the viewer. Inside Claude the viewer confirms the save; as a plain file it downloads. */
function saveFile(name,data,mime){
  var blob=new Blob([data],{type:mime});
  if(!(window.claude&&window.claude.use)){
    try{ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Saved '+name); }
    catch(e){ toast('Export is not available here'); }
    return;
  }
  window.claude.use('downloads').then(function(dl){
    if(!dl) return toast('Export is not available in this view');
    return dl.save({filename:name,data:blob}).then(function(){ toast('Saved '+name); },function(e){
      var code=e&&e.code; if(code==='declined') return;
      toast(code==='rate_limited'?'Finish the save that is already open':'Export is not available in this view');
    });
  });
}

function rescale(e,t){
  var old=sum(e.alloc,function(a){ return a.amt; }), acc=0;
  e.alloc.forEach(function(a,i){ if(i<e.alloc.length-1){ a.amt=Math.round(a.amt/old*t); acc+=a.amt; } else a.amt=t-acc; });
}

    reF();
  },
  fdel:function(b){ syncForm(); S.F.rows.splice(+b.dataset.k,1); reF(); },
  fsplit:function(){
    syncForm(); var F=S.F, t=F.qty*F.cost, n=F.rows.length, each=Math.floor(t/n);
    F.rows.forEach(function(r,i){ r.amt=each+(i===0?t-each*n:0); }); reF();
  },
  fsave:function(){
    syncForm();
    var F=S.F, t=F.qty*F.cost, alloc=F.rows.map(function(r){ return {reg:r.reg,amt:r.amt}; }), names=alloc.map(function(a){ return a.reg; }).join(', '), n=alloc.length, old, was, recs, P;
    var many=n>1?'Saved as '+n+' entries, one for each vehicle.':'';
    if(F.mode==='pc'){
      old=F.id?entry('pc',F.id):null; was=old?money(tot(old)):'';
      recs=splitRec({id:old?old.id:SEQ++,date:F.date,who:F.who,item:F.item,qty:F.qty,cost:F.cost,alloc:alloc,status:'waiting',why:'',reopened:old?old.reopened:''});
      if(old){ PC.splice.apply(PC,[PC.indexOf(old),1].concat(recs)); if(was!==money(t)||n>1) logit('Petty cash entry, '+names+', '+item(F.item).name,was,money(t)); }
      else recs.forEach(function(x){ PC.push(x); });
      P=S.per.pc; if(F.date<P.from||F.date>P.to) S.per.pc={from:F.date,to:F.date,unit:'day'};
      S.pcView='exp'; S.F=null; $('dlg').close(); go('pettycash'); toast(many||(old?'Saved':'Saved. Waiting for approval.'));
    } else {
      old=F.id?entry('exp',F.id):null; was=old?dmy(old.date)+', '+money(tot(old)):'';
      recs=splitRec({id:old?old.id:SEQ++,date:F.date,item:F.item,qty:F.qty,cost:F.cost,alloc:alloc,src:'central',by:old?old.by:S.user.id});
      if(old){ EXP.splice.apply(EXP,[EXP.indexOf(old),1].concat(recs)); logit('Central expense edited, '+names+', '+item(F.item).name,was,dmy(F.date)+', '+money(t)); }
      else {
        recs.forEach(function(x){ EXP.push(x); });
        logit('Central expense recorded, '+names+', '+item(F.item).name,'',money(t));
        if(S.expSrc==='pc'||S.expSrc==='sched') S.expSrc='all';
      }
      P=S.per.exp; if(F.date<P.from||F.date>P.to){ var w0=wk(F.date); S.per.exp={from:w0,to:add(w0,6),unit:'week'}; }
      S.F=null; $('dlg').close(); render(); toast(many||(old?'Saved':'Posted to '+names));
    }
  },

  schedtab:function(b){ S.schedTab=b.dataset.k; render(); },
  schedruns:function(b){ S.dlgId=+b.dataset.id; openRuns(); },
  schednew:function(){ S.SF={kind:S.schedTab,item:'',name:'',regs:fullScope()?'all':[],amt:'',freq:'monthly',day:'Saturday',dom:1,mon:0}; openSched(S.schedTab==='expense'?'fItemQ':'sName'); },
  schededit:function(b){ var s=SCHED.filter(function(x){ return x.id===+b.dataset.id; })[0]; S.SF=JSON.parse(JSON.stringify(s)); if(!S.SF.day) S.SF.day='Saturday'; if(!S.SF.dom) S.SF.dom=1; if(S.SF.mon==null) S.SF.mon=0; openSched('sAmt'); },
  schedpause:function(b){ var s=SCHED.filter(function(x){ return x.id===+b.dataset.id; })[0]; s.paused=!s.paused; logit('Scheduled, '+sname(s),s.paused?'Running':'Paused',s.paused?'Paused':'Running'); render(); toast(sname(s)+(s.paused?' paused':' running')); },
  sfsave:function(){
    syncSF(); var F=S.SF, msg='Saved';
    if(F.kind==='expense'?!F.item:!F.name) return showErr('sErr',F.kind==='expense'?'Choose the item.':'Enter the name.');
    if(!F.amt) return showErr('sErr','Enter the amount.');
    if(F.cond&&!F.cond.min) return showErr('sErr','Enter the revenue target.');
    if(F.open) F.open.amts=openAmts(F);
    if(F.open&&F.open.date>TODAY) return showErr('sErr','The opening balance date is after today.');
    if(F.open&&!Object.keys(F.open.amts).length) return showErr('sErr','Enter the opening balance for at least one vehicle.');
    if(F.regs!=='all'&&!F.regs.length) return showErr('sErr','Pick at least one vehicle.');
    var txt=function(q){ return money(q.amt)+', '+when(q)+(q.kind==='saving'?', '+ruleText(q)+(q.open?', opening '+money(sum(Object.keys(q.open.amts),function(k){ return q.open.amts[k]; }))+' as at '+dmy(q.open.date):''):''); };
    if(F.id){
      var i=SCHED.map(function(x){ return x.id; }).indexOf(F.id), was=txt(SCHED[i]), now=txt(F);
      SCHED[i]=F; if(was!==now) logit('Scheduled, '+sname(F),was,now);
      msg='Saved. Applies from the next run.';
    } else {
      F.id=SEQ++; F.paused=false; F.since=TODAY; SCHED.push(F); logit('Scheduled added, '+sname(F),'',txt(F));
      if(runsOn(F,TODAY)){ postRun(F,TODAY); msg=F.kind==='expense'?'Saved. Today’s run is in central expenses.':F.cond?'Saved. Today’s run waits for today’s revenue.':'Saved. Today’s run is posted.'; }
      else msg='Saved. First run '+dmy(nextRun(F))+'.';
    }
    S.SF=null; $('dlg').close(); render(); toast(msg);
  },

  rep:function(b){ S.rep=b.dataset.r; render(); },

  itemtab:function(b){ S.itemTab=b.dataset.t; S.edit=null; render(); },
  itemstop:function(b){ var i=item(b.dataset.id); i.stopped=!i.stopped; logit('Expense item, '+i.name,i.stopped?'In use':'Stopped',i.stopped?'Stopped':'In use'); render(); },
  person:function(b){ S.personId=b.dataset.id||null; openPerson(); },
  personblock:function(b){ var p=person(b.dataset.id); p.blocked=!p.blocked; logit('Access, '+pname(p.id),p.blocked?'Active':'Blocked',p.blocked?'Blocked':'Active'); render(); toast(pname(p.id)+(p.blocked?' blocked':' unblocked')); },
  personsave:function(){
    var first=val('pFirst'), last=val('pLast'), ph=normPhone(val('pPhone')), em=val('pEmail'), p=person(S.personId);
    if(!first||!last) return showErr('pErr','Enter the first and last name.');
    if(!/^0\d{9}$/.test(ph)) return showErr('pErr','Enter a 10 digit mobile number starting with 0.');
    if(PEOPLE.some(function(x){ return x.phone===ph&&x!==p; })) return showErr('pErr','This mobile number is already used.');
    if(!/^\S+@\S+\.\S+$/.test(em)) return showErr('pErr','Enter the email that receives codes.');
    var pr={}, regs, ticked=[], wasP=p?p.regs||'all':null;
    Array.prototype.forEach.call(document.querySelectorAll('.pk'),function(c){ if(c.checked) pr[c.dataset.k]=true; });
    Array.prototype.forEach.call(document.querySelectorAll('.pv'),function(c){ if(c.checked) ticked.push(c.dataset.reg); });
    if(fullScope()) regs=$('pAll').checked?'all':ticked;
    else if(p&&wasP==='all') regs='all';
    else regs=(p?wasP.filter(function(r){ return !sees(r); }):[]).concat(ticked);
    if(regs!=='all'&&!regs.length) return showErr('pErr','Pick at least one vehicle this person can see.');
    if(p&&p.id===S.user.id&&!pr['ppl.edit']) return showErr('pErr','You cannot remove your own right to edit people and their access.');
    var nowT=accessText({perms:pr})+', '+regsText({regs:regs});
    if(!p){ p={id:'p'+SEQ++,pin:'0000',perms:{},seen:''}; PEOPLE.push(p); logit('Person added, '+first+' '+last,'',nowT); }
    else { var wasT=accessText(p)+', '+regsText(p); if(wasT!==nowT) logit('Access, '+first+' '+last,wasT,nowT); }
    p.regs=regs;
    p.first=first; p.last=last; p.title=val('pTitle'); p.phone=ph; p.email=em; p.perms=pr; p.float=$('pFloat').checked; if(p.float&&p.base==null) p.base=0;
    var wasDef=!!p.pcDefault; p.pcDefault=p.float&&$('pDef').checked;
    if(p.pcDefault){ PEOPLE.forEach(function(x){ if(x!==p) x.pcDefault=false; }); if(!wasDef) logit('Default petty cash manager','',first+' '+last); }
    $('dlg').close(); render(); toast('Saved');
  },
  dlg:function(b){ S.dlgId=b.dataset.id||null; openDlg(b.dataset.kind); },
  dlgclose:function(){ $('dlg').close(); },
  dlgsave:function(b){ saveDlg(b.dataset.kind); }
};
function gapOrToday(){ var g=gapList(add(wk(TODAY),-7),TODAY); return g.length?g[g.length-1].date:TODAY; }

document.addEventListener('click',function(ev){
  if(S.pop&&!ev.target.closest('#pop')&&!ev.target.closest('[data-pop]')) closePop();
  var b=ev.target.closest('[data-act]'); if(!b||b.disabled) return;
  var f=ACT[b.dataset.act]; if(f) f(b);
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&S.pop){ closePop(); return; }
  if(ev.key!=='Enter') return;
  var id=ev.target.id;
  if(id==='siPhone'||id==='siPin') ACT.signin();
  else if(ev.target.dataset&&ev.target.dataset.in==='capcell'){ ev.preventDefault(); var nx=$('cp-'+(+id.slice(3)+1)); if(nx){ nx.focus(); nx.select(); } else $('capSave').focus(); }
  else if(ev.target.tagName==='INPUT'&&ev.target.type!=='checkbox'&&ev.target.closest('#dlg')){ var b=$('dlg').querySelector('.mf .btn:last-child'); if(b&&!b.disabled&&b.dataset.act!=='dlgclose'){ ev.preventDefault(); b.click(); } }
});
function onInput(ev){
  var t=ev.target, k=t.dataset&&t.dataset.in; if(!k) return;
  if(k==='revcell'){ var s=$('rr-'+t.dataset.d); s.hidden=num(t.value)>0; if(s.hidden) s.value=''; }
  else if(k==='capcell'){
    var s2=$('cr-'+t.id.slice(3)); s2.disabled=num(t.value)>0; if(s2.disabled) s2.value='';
    $('capTot').textContent=kes(sum(Array.prototype.slice.call(document.querySelectorAll('[data-in=capcell]')),function(i){ return num(i.value); }));
  }
  else if(k==='form'){ if(!S.F||!$('fItem')) return; syncForm(); paintForm(); }
  else if(k==='sform'){ syncSF(); paintSched(); }
  else if(k==='pcq'){ S.pcQ=t.value; $('pcT').innerHTML=pcTables(); }
  else if(k==='repq'){ S.repQ=t.value; $('repT').innerHTML=repTable(currentReport()); }
  else if(k==='revq'){ S.revQ=t.value; S.edit=null; $('revT').innerHTML=revTable(); }
  else if(k==='expq'){ S.expQ=t.value; $('expT').innerHTML=expTable(); }
}
document.addEventListener('input',onInput);
document.addEventListener('scroll',function(ev){ if(S.pop&&ev.target.id==='work') closePop(); },true);
document.addEventListener('change',function(ev){
  var t=ev.target, k=t.dataset&&t.dataset.in; if(!k) return;
  if(k==='viewas'){ var pv=parentOf(S.view); S.user=person(t.value); S.edit=null; S.F=null; S.SF=null; S.pcReject=null; S.pcSel={}; S.pcWho='all'; S.view=allowed(pv)?pv:firstAllowed(); render(); }
  else if(k==='company'){ S.company=t.value; S.edit=null; render(); }
  else if(k==='expsrc'){ S.expSrc=t.value; $('expT').innerHTML=expTable(); }
  else if(k==='sform'){ syncSF(); if(t.id.indexOf('sv-')===0&&S.SF.open) openSched(t.id); else paintSched(); }
  else if(k==='dwho'){ paintCash(); }
  else if(k==='pfloat'){ var pd=$('pDef'); pd.disabled=!t.checked; if(!t.checked) pd.checked=false; }
  else if(k==='pcstatus'){ S.pcStatus=t.value; $('pcT').innerHTML=pcTables(); }
  else if(k==='pcwhosel'){ S.pcWho=t.value; S.pcSel={}; render(); }
  else if(k==='pcrepsel'){ S.pcRep=t.value; render(); }
  else if(k==='repsel'){ if(S.repGroup==='petty') S.pcRep=t.value; else S.rep=t.value; render(); }
  else if(k==='repwho'){ S.repWho=t.value; render(); }
  else if(k==='pcsel'){ S.pcSel[t.dataset.id]=t.checked; $('pcAp').outerHTML=pcApproveBtn(); }
  else if(k==='sfreq'){ syncSF(); openSched('sFreq'); }
  else if(k==='scond'){ syncSF(); openSched(S.SF.cond?'sMin':'sCond'); }
  else if(k==='sopen'){ syncSF(); openSched('sOpen'); }
  else if(k==='sall'){ syncSF(); openSched('sAll'); }
  else if(k==='pall'){ $('pRegs').hidden=t.checked; }
  else if(k==='permall'){ Array.prototype.forEach.call(document.querySelectorAll('.pk[data-g="'+t.dataset.g+'"]'),function(c){ c.checked=t.checked; }); }
  else if(k==='perm'){
    var g=t.dataset.g, grp=Array.prototype.slice.call(document.querySelectorAll('.pk[data-g="'+g+'"]')), base=grp.filter(function(c){ return c.dataset.base; })[0], pa=$('pa-'+g);
    if(base){ if(t===base&&!t.checked) grp.forEach(function(c){ c.checked=false; }); else if(t!==base&&t.checked) base.checked=true; }
    if(pa) pa.checked=grp.every(function(c){ return c.checked; });
  }
  else if(k==='form'){ onInput(ev); }
});

$('dlg').addEventListener('close',function(){ S.F=null; S.SF=null; });
$('dlg').addEventListener('cancel',function(ev){ var b=$('fItemList'); if(b&&!b.hidden){ ev.preventDefault(); comboClose(); } });
render();
})();
</script>
