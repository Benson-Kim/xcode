name: xcode-api

on:
  push:
    paths:
      - "apps/api-python/**"
      - ".github/workflows/xcode-api.yml"
    tags:
      - "xcode-api-v*"
  pull_request:
    paths:
      - "apps/api-python/**"
      - ".github/workflows/xcode-api.yml"

# Actions are pinned by commit; the tag each commit had on 2026-10-12 is in the comment.
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api-python

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Lock drift (runtime)
        run: |
          uv pip compile --universal --python-version 3.13 --generate-hashes requirements.txt -o requirements.lock.txt
          git diff --exit-code requirements.lock.txt
      - name: Lock drift (dev)
        run: |
          uv pip compile --universal --python-version 3.13 --generate-hashes requirements-dev.txt -o requirements-dev.lock.txt
          git diff --exit-code requirements-dev.lock.txt

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xcode_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      XCODE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xcode_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt
          pip install --no-deps -e .
      - name: pytest
        run: pytest -n auto -p no:cacheprovider

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: pip-audit (locked runtime deps)
        run: pip-audit --strict -r requirements.lock.txt

  db-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xcode"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      XCODE_ENV: testing
      XCODE_MIGRATION_DATABASE_URL: postgresql://xcode_owner:xcode_owner@localhost:5432/xcode
      XCODE_OPERATOR: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install --no-deps -e .
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create roles, schemas and grants
        run: |
          psql -h localhost -U postgres -d xcode -v ON_ERROR_STOP=1 -f db/roles/010_roles.sql
          psql -h localhost -U postgres -d xcode -v ON_ERROR_STOP=1 -f db/roles/900_local_dev.sql
          psql -h localhost -U postgres -d xcode -v ON_ERROR_STOP=1 -c "ALTER DATABASE xcode OWNER TO xcode_owner"
          PGPASSWORD=xcode_owner psql -h localhost -U xcode_owner -d xcode -v ON_ERROR_STOP=1 -f db/roles/020_schemas.sql
          PGPASSWORD=xcode_owner psql -h localhost -U xcode_owner -d xcode -v ON_ERROR_STOP=1 -f db/roles/030_grants.sql
      - name: Migrate, status and verify a fresh database
        run: |
          xcode-api db migrate
          xcode-api db status
          xcode-api db verify
      - name: Seed the demo and verify again
        env:
          XCODE_ENV: development
          XCODE_DATABASE_OPERATOR_URL: postgresql://xcode_operator:xcode_operator@localhost:5432/xcode
        run: |
          xcode-api seed-demo
          xcode-api seed-demo | grep -q "created=no"
          xcode-api db verify

  migration-tool:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      XCODE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the API CLI and the tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install --no-deps -e .
          pip install --require-hashes -r tools/migrate_from_sqlserver/requirements.lock.txt
          pip install -r tools/migrate_from_sqlserver/requirements-dev.txt
      - name: Lint, types and tests
        working-directory: apps/api-python/tools/migrate_from_sqlserver
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q

  image:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, audit, db-verify, migration-tool]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (Docker refuses upper case; the owner has some)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xcode-api" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -f deploy/Dockerfile -t "$IMAGE:${{ github.sha }}" .
      - name: Vulnerability scan (fails on critical and high findings that have a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: The container runs as uid 10001 with a read-only root
        run: |
          test "$(docker run --rm --read-only --tmpfs /tmp --entrypoint id "$IMAGE:${{ github.sha }}" -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp "$IMAGE:${{ github.sha }}" --help
      - name: Push on tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker tag "$IMAGE:$COMMIT" "$IMAGE:$RELEASE"
          docker push "$IMAGE:$COMMIT"
          docker push "$IMAGE:$RELEASE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$RELEASE"
