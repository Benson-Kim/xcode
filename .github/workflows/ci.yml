name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

# A newer push to a branch never cancels a run that may be deploying (a migration or upload cut off halfway);
# pull requests still cancel their older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails when package-lock.json is out of step with any workspace's package.json.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:lint-rules
      - run: npm run test:shared
      - run: npm run test:web

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:mobile

  # The API's own workflow: lint, types, tests on PostgreSQL, audit, a fresh database verified and seeded, the
  # migration tool and the image scan. Its image job asks for packages: write, used only to push on a release tag.
  api:
    uses: ./.github/workflows/xcode-api.yml
    permissions:
      contents: read
      packages: write

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: xcode-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: The image starts and serves the sign-in page with its security policy
        run: |
          docker run -d --name web -p 3000:3000 -e API_URL=https://api.example.test -e TRUSTED_PROXY_HOPS=0 xcode-web:ci
          curl --retry 15 --retry-delay 2 --retry-all-errors -fsS -D headers.txt -o /dev/null http://localhost:3000/
          grep -i '^content-security-policy:' headers.txt
      - if: failure()
        run: docker logs web || true

  # Staging: a push to develop that passes every job above deploys. Nothing reaches into a host: the API, the web build
  # and the Android app are published as GitHub releases, and the droplet (apps/api-python/deploy/install-release.sh)
  # and the cPanel account (deploy/cpanel/update.sh) install them themselves.
  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [js, mobile, api, web-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      name: staging
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      # The web app and the phones send PINs and tokens to the API: nothing changes until its address answers over
      # HTTPS with a valid certificate.
      - name: The API's address answers over HTTPS
        run: |
          case "$API_URL" in https://*) ;; *) echo "::error::API_URL must start with https://"; exit 1 ;; esac
          curl -sS -o /dev/null --max-time 60 "$API_URL/health"
      - uses: actions/checkout@v4
      - name: Package the API source of this commit
        run: |
          name="xcode-api-${GITHUB_SHA::12}.tar.gz"
          git archive --format=tar.gz -o "$RUNNER_TEMP/$name" "$GITHUB_SHA:apps/api-python"
          (cd "$RUNNER_TEMP" && sha256sum "$name" > xcode-api.tar.gz.sha256)
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
      - name: Publish for the droplet to install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete staging-api --yes --cleanup-tag || true
          gh release create staging-api "$RUNNER_TEMP/$ARCHIVE" "$RUNNER_TEMP/xcode-api.tar.gz.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "Staging API" \
            --notes "API source of $GITHUB_SHA. The staging droplet installs it within a few minutes (apps/api-python/deploy/install-release.sh)."
      # The droplet looks every two minutes and names the commit it runs at /release once that build is ready.
      - name: The API runs this commit and reaches its database
        run: |
          want="${GITHUB_SHA::12}"
          for _ in $(seq 1 45); do
            if [ "$(curl -fsS --max-time 10 "$API_URL/release" 2> /dev/null)" = "$want" ]; then
              curl --retry 10 --retry-delay 5 --retry-all-errors -fsS --max-time 30 "$API_URL/health/ready"
              exit 0
            fi
            sleep 20
          done
          echo "::error::the staging droplet has not installed $want after 15 minutes (journalctl -u xcode-stg-update there)"
          exit 1

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    environment:
      name: staging
      url: ${{ vars.WEB_URL }}
    concurrency:
      group: deploy-staging-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
        env:
          NEXT_OUTPUT: standalone
      - run: bash deploy/cpanel/package.sh "$GITHUB_SHA" "$API_URL" "$RUNNER_TEMP/web"
        env:
          API_URL: ${{ vars.API_URL }}
      - name: Publish for the cPanel account to install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete staging-web --yes --cleanup-tag || true
          gh release create staging-web "$RUNNER_TEMP/web/xcode-web.tar.gz" "$RUNNER_TEMP/web/xcode-web.tar.gz.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "Staging web" \
            --notes "Web build of $GITHUB_SHA. The cPanel account installs it within five minutes (deploy/cpanel/update.sh)."

  android:
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    environment:
      name: staging
    concurrency:
      group: deploy-staging-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Generate the Android project, signed with the staging key
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          echo 'apply from: file("../../../../deploy/android/release-signing.gradle")' >> android/app/build.gradle
      - name: Build the APK against the staging API
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          # The app compares its own build number with version.json, published next to the APK, and offers the newer one.
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/staging-android/version.json
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.0-staging.${{ github.run_number }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/staging.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          rm -f "$ANDROID_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/xcode-staging.apk"
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          printf '{"build":%s,"version":"1.0.0-staging.%s","url":"https://github.com/%s/releases/download/staging-android/xcode-staging.apk","commit":"%s"}\n' \
            "$BUILD" "$BUILD" "$REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/version.json"
          gh release delete staging-android --yes --cleanup-tag || true
          gh release create staging-android "$RUNNER_TEMP/xcode-staging.apk" "$RUNNER_TEMP/version.json" \
            --target "$GITHUB_SHA" --prerelease --title "Staging Android app" \
            --notes "Android app for staging, built from $GITHUB_SHA. Open this page on the phone, download xcode-staging.apk and install it."
