name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

# A newer push to a branch never cancels a run that may be deploying (a migration or upload cut off halfway);
# pull requests still cancel their older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails when package-lock.json is out of step with any workspace's package.json.
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:lint-rules
      - run: npm run test:shared
      - run: npm run test:web

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:mobile

  # The API's own workflow: lint, types, tests on PostgreSQL, audit, a fresh database verified and seeded, the
  # migration tool and the image scan. Its image job asks for packages: write, used only to push on a release tag.
  api:
    uses: ./.github/workflows/xcode-api.yml
    permissions:
      contents: read
      packages: write

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: xcode-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: The image starts and serves the sign-in page with its security policy
        run: |
          docker run -d --name web -p 3000:3000 -e API_URL=https://api.example.test -e TRUSTED_PROXY_HOPS=0 xcode-web:ci
          curl --retry 15 --retry-delay 2 --retry-all-errors -fsS -D headers.txt -o /dev/null http://localhost:3000/
          grep -i '^content-security-policy:' headers.txt
      - if: failure()
        run: docker logs web || true

  # A push that passes every job above deploys (deploy.yml): develop to staging, master to the migration instance
  # (https://xcode.mgr.priori.co.ke, the real data the store builds use). The Android app is built for staging only.
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [js, mobile, api, web-image]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
    with:
      environment: staging
      release: staging
      title: Staging
      update_unit: xcode-stg-update

  migration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [js, mobile, api, web-image]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
    with:
      environment: migration
      release: migration
      title: Migration
      update_unit: xcode-mgr-update
      api_url: https://api.xcode.mgr.priori.co.ke
      web_url: https://xcode.mgr.priori.co.ke

  android:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    environment:
      name: staging
    concurrency:
      group: deploy-staging-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Generate the Android project, signed with the staging key
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          echo 'apply from: file("../../../../deploy/android/release-signing.gradle")' >> android/app/build.gradle
      - name: Build the APK against the staging API
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          # The app compares its own build number with version.json, published next to the APK, and offers the newer one.
          EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/staging-android/version.json
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.0-staging.${{ github.run_number }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/staging.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          rm -f "$ANDROID_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/xcode-staging.apk"
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          printf '{"build":%s,"version":"1.0.0-staging.%s","url":"https://github.com/%s/releases/download/staging-android/xcode-staging.apk","commit":"%s"}\n' \
            "$BUILD" "$BUILD" "$REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/version.json"
          gh release delete staging-android --yes --cleanup-tag || true
          gh release create staging-android "$RUNNER_TEMP/xcode-staging.apk" "$RUNNER_TEMP/version.json" \
            --target "$GITHUB_SHA" --prerelease --title "Staging Android app" \
            --notes "Android app for staging, built from $GITHUB_SHA. Open this page on the phone, download xcode-staging.apk and install it."
