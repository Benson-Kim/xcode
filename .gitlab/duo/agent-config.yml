# GitLab Duo Agent Platform flow execution configuration.
#
# SECURITY NOTE: this file is read from the DEFAULT BRANCH only, and its
# setup_script runs with the triggering user's credentials in every future
# flow. Review changes here like production code.
#
# Design rules for this file:
#   - No privileged operations. Nothing runs as root, no packages are
#     installed, and nothing is written outside /tmp.
#   - No persistence. Nothing is appended to /etc/environment, /etc/profile.d,
#     ~/.bashrc or ~/.profile, and nothing is symlinked into /usr/bin or
#     /usr/local/bin. The sandbox is left exactly as it was found.
#   - Loud failures. A failed step exits non-zero instead of being swallowed
#     by `|| true`.

setup_script:
  - node --version || { echo "FATAL: node is missing from the sandbox image"; exit 1; }

network_policy:
  include_recommended_allowed: true
  # Exact hosts only: wildcards on shared-tenant CDNs grant far more egress
  # than this project needs.
  allowed_domains:
    # npm restore for apps/web, apps/mobile and packages/shared.
    - "registry.npmjs.org"
