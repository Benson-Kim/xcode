# Configuration of the migration tool only: it is not a package to install. Run it from this
# directory as `python -m migrate_from_sqlserver <command>`.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "sqlserver: needs SQLSERVER_TEST_CONNECTION (skipped otherwise)",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "RUF", "PL", "T20", "ERA"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S608", "PLC0415", "PLR0917"]
"migrate_from_sqlserver/report.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["migrate_from_sqlserver"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["migrate_from_sqlserver"]
